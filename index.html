// ---------------------------------------------------------------------------
// FOTO REALI (Wikipedia REST API)
// ---------------------------------------------------------------------------
// Recupera in tempo reale una foto reale del paese (e qualche foto extra per la
// galleria) dall'API pubblica di Wikipedia. Nessuna immagine è incorporata o
// verificata a mano: se la richiesta fallisce, l'interfaccia ricade
// sull'illustrazione a icone.
const mediaCache = new Map();

function useCountryMedia(enName) {
  const [state, setState] = useState(() => mediaCache.get(enName) || { status: "loading", photo: null, gallery: [] });

  useEffect(() => {
    if (mediaCache.has(enName)) {
      setState(mediaCache.get(enName));
      return;
    }
    let cancelled = false;
    setState({ status: "loading", photo: null, gallery: [] });

    (async () => {
      try {
        const summaryRes = await fetch(
          `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(enName)}`
        );
        if (!summaryRes.ok) throw new Error("no summary");
        const summary = await summaryRes.json();
        const photo = summary?.originalimage?.source || summary?.thumbnail?.source || null;

        let gallery = [];
        try {
          const mediaRes = await fetch(
            `https://en.wikipedia.org/api/rest_v1/page/media-list/${encodeURIComponent(enName)}`
          );
          if (mediaRes.ok) {
            const media = await mediaRes.json();
            gallery = (media.items || [])
              .filter((it) => it.type === "image" && Array.isArray(it.srcset) && it.srcset.length)
              .map((it) => {
                const src = it.srcset[it.srcset.length - 1].src;
                return src.startsWith("//") ? `https:${src}` : src;
              })
              .filter((src) => /\.(jpe?g|png)(\?|$)/i.test(src))
              .slice(0, 6);
          }
        } catch (e) {
          // niente galleria extra, va bene lo stesso
        }

        const result = { status: "ready", photo, gallery };
        mediaCache.set(enName, result);
        if (!cancelled) setState(result);
      } catch (e) {
        const result = { status: "error", photo: null, gallery: [] };
        mediaCache.set(enName, result);
        if (!cancelled) setState(result);
      }
    })();

    return () => {
      cancelled = true;
    };
  }, [enName]);

  return state;
}

let exchangeRatesPromise = null;

function useExchangeRates() {
  const [state, setState] = useState({ status: "loading", rates: null });
  useEffect(() => {
    if (!exchangeRatesPromise) {
      exchangeRatesPromise = fetch("https://open.er-api.com/v6/latest/EUR")
        .then((r) => r.json())
        .then((d) => (d && d.result === "success" ? d.rates : null));
    }
    exchangeRatesPromise
      .then((rates) => setState({ status: rates ? "ready" : "error", rates }))
      .catch(() => setState({ status: "error", rates: null }));
  }, []);
  return state;
}

function extractCurrencyCode(currencyString) {
  const m = currencyString.match(/\(([A-Z]{3})/);
  return m ? m[1] : null;
}

const weatherCache = new Map();

function useCapitalWeather(capital) {
  const [state, setState] = useState(() => weatherCache.get(capital) || { status: "loading", temp: null, code: null });

  useEffect(() => {
    if (weatherCache.has(capital)) {
      setState(weatherCache.get(capital));
      return;
    }
    let cancelled = false;
    (async () => {
      try {
        const geoRes = await fetch(
          `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(capital)}&count=1`
        );
        const geo = await geoRes.json();
        const loc = geo?.results?.[0];
        if (!loc) throw new Error("città non trovata");
        const wRes = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current_weather=true`
        );
        const w = await wRes.json();
        const cw = w?.current_weather;
        if (!cw) throw new Error("meteo non disponibile");
        const result = { status: "ready", temp: cw.temperature, code: cw.weathercode };
        weatherCache.set(capital, result);
        if (!cancelled) setState(result);
      } catch (e) {
        const result = { status: "error", temp: null, code: null };
        weatherCache.set(capital, result);
        if (!cancelled) setState(result);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [capital]);

  return state;
}

function FlightsPage() {
  const sorted = useMemo(() => {
    return [...COUNTRIES]
      .map((c) => ({ ...c, price: FLIGHT_PRICE_BY_COUNTRY[c.name] || 0 }))
      .sort((a, b) => {
        if (a.price === 0 && b.price === 0) return a.name.localeCompare(b.name);
        if (a.price === 0) return 1;
        if (b.price === 0) return -1;
        return a.price - b.price;
      });
  }, []);
  const maxPrice = Math.max(...sorted.map((c) => c.price));

  return (
    <div>
      <div className="mb-6 max-w-lg">
        <div className="flex items-center gap-2 text-[#3F7268]">
          <Ticket size={16} strokeWidth={1.75} />
          <span className="text-[11px] tracking-[0.14em] uppercase">Budget di viaggio</span>
        </div>
        <h2 className="font-serif text-[26px] text-[#1B2A38] mt-1.5 leading-tight">
          Prezzo medio del volo da Roma
        </h2>
        <p className="text-[13px] text-[#5c5644] mt-2.5 leading-relaxed">
          Stima indicativa di un volo andata/ritorno in classe economica: sono valori orientativi che
          <em> non</em> si aggiornano in tempo reale (servirebbe un accesso a pagamento a un motore di
          ricerca voli). Il cambio valuta e il meteo, invece, li trovi live nella pagina di ogni paese.
          Per i paesi in conflitto o senza voli commerciali regolari il prezzo non è disponibile.
          Il prezzo reale del volo varia molto in base a stagione, anticipo di prenotazione e compagnia —
          verifica sempre sui motori di ricerca voli prima di decidere.
        </p>
      </div>

      <div className="space-y-1.5">
        {sorted.map((c) => {
          const color = CONTINENT_COLORS[c.continent];
          const widthPct = c.price ? Math.max(6, Math.round((c.price / maxPrice) * 100)) : 0;
          return (
            <div
              key={c.name}
              className={`flex items-center gap-3 bg-[#F7F3E8] border border-[#d8cdb2] px-3 py-2.5 ${!c.price ? "opacity-60" : ""}`}
            >
              <span className="text-[20px] w-7 text-center shrink-0">{c.flag}</span>
              <div className="w-32 sm:w-40 shrink-0 min-w-0">
                <div className="text-[13.5px] text-[#1B2A38] leading-tight truncate">{c.name}</div>
                <div className="text-[10px] text-[#8a7f66] uppercase tracking-wide">
                  {CONTINENTS.find((x) => x.id === c.continent)?.label}
                </div>
              </div>
              <div className="flex-1 h-2 bg-[#EDE6D6] relative overflow-hidden hidden sm:block">
                <div className="h-full" style={{ width: `${widthPct}%`, backgroundColor: color }} />
              </div>
              <div className="w-28 text-right font-serif text-[13px] text-[#1B2A38] shrink-0">
                {c.price ? `~${c.price}€` : "Non disponibile"}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function MapPage({ visited, onToggleVisited, onOpenCountry }) {
  const visitedCount = visited.size;

  const recommendations = useMemo(() => {
    if (visitedCount === 0) return [];
    const visitedCountries = COUNTRIES.filter((c) => visited.has(c.name));
    const continents = new Set(visitedCountries.map((c) => c.continent));
    const scenes = new Set(visitedCountries.map((c) => SCENE_BY_COUNTRY[c.name]));
    return COUNTRIES.filter((c) => !visited.has(c.name))
      .map((c) => {
        let score = 0;
        if (continents.has(c.continent)) score += 2;
        if (scenes.has(SCENE_BY_COUNTRY[c.name])) score += 1;
        return { ...c, score };
      })
      .filter((c) => c.score > 0)
      .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name))
      .slice(0, 6);
  }, [visited, visitedCount]);

  return (
    <div className="max-w-5xl mx-auto px-5 py-8">
      <div className="flex items-center gap-2 text-[#3F7268]">
        <MapPinned size={16} strokeWidth={1.75} />
        <span className="text-[11px] tracking-[0.14em] uppercase">La tua mappa</span>
      </div>
      <h2 className="font-serif text-[26px] text-[#1B2A38] mt-1.5 leading-tight">
        Dove sei già stato, dove andare ancora.
      </h2>
      <p className="text-[13px] text-[#5c5644] mt-2.5 leading-relaxed max-w-lg">
        Non è una cartografia esatta ma una mappa schematica, divisa per continente: tocca i paesi che hai
        già visitato e in fondo troverai qualche idea su dove andare dopo, in base ai tuoi gusti.
      </p>
      <div className="mt-3 inline-flex items-center gap-2 border border-dashed border-[#8a7f66] px-3 py-1.5 text-[12px] text-[#8a7f66]">
        <CheckCircle2 size={13} className="text-[#3F7268]" />
        {visitedCount} paesi visitati su {COUNTRIES.length}
      </div>

      <div className="mt-7 space-y-6">
        {CONTINENT_ORDER.map((id) => {
          const label = CONTINENTS.find((c) => c.id === id).label;
          const color = CONTINENT_COLORS[id];
          const items = COUNTRIES.filter((c) => c.continent === id).sort((a, b) => a.name.localeCompare(b.name));
          return (
            <section key={id} className="border border-[#d8cdb2] bg-[#F7F3E8]">
              <div className="flex items-center gap-2 px-4 py-2.5 border-b border-[#d8cdb2]" style={{ backgroundColor: `${color}1A` }}>
                <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: color }} />
                <span className="font-serif text-[15px] text-[#1B2A38]">{label}</span>
                <span className="text-[11px] text-[#8a7f66] ml-auto">
                  {items.filter((c) => visited.has(c.name)).length}/{items.length} visitati
                </span>
              </div>
              <div className="p-3 flex flex-wrap gap-1.5">
                {items.map((c) => {
                  const isVisited = visited.has(c.name);
                  return (
                    <button
                      key={c.name}
                      onClick={() => onToggleVisited(c.name)}
                      className="flex items-center gap-1.5 px-2.5 py-1.5 border text-[12px] transition-colors"
                      style={{
                        borderColor: isVisited ? color : "#d8cdb2",
                        backgroundColor: isVisited ? color : "#EDE6D6",
                        color: isVisited ? "#F7F3E8" : "#1B2A38",
                      }}
                      title={isVisited ? "Segnato come visitato" : "Segna come visitato"}
                    >
                      <span>{c.flag}</span>
                      {c.name}
                      {isVisited && <CheckCircle2 size={12} />}
                    </button>
                  );
                })}
              </div>
            </section>

      </div>

      <div className="mt-10">
        <div className="flex items-center gap-3 mb-3.5">
          <Sparkles size={16} className="text-[#3F7268]" />

          <div className="flex-1 border-t border-dashed border-[#d8cdb2]" />
        </div>
        {visitedCount === 0 ? (
          <p className="text-[13px] text-[#8a7f66]">
            Seleziona qualche paese già visitato qui sopra: in base a continenti e stile di viaggio ti
            suggerirò altre destinazioni da guardare nella guida.
          </p>
        ) : recommendations.length === 0 ? (
          <p className="text-[13px] text-[#8a7f66]">
            Hai già visitato praticamente tutto quello che si assomiglia! Prova a esplorare un continente nuovo.
          </p>
        ) : (
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
            {recommendations.map((c) => (
              <CountryCard key={c.name} country={c} onOpen={onOpenCountry} />
            ))}

function BlogPage({ posts, onAddPost, onDeletePost, storageReady }) {
  const [showForm, setShowForm] = useState(false);
  const [title, setTitle] = useState("");
  const [countryName, setCountryName] = useState("");
  const [tripDate, setTripDate] = useState("");
  const [content, setContent] = useState("");
  const [rating, setRating] = useState(0);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  const resetForm = () => {
    setTitle("");
    setCountryName("");
    setTripDate("");
    setContent("");
    setRating(0);
  };

  const handleSubmit = () => {
    if (!title.trim() || !content.trim()) return;
    onAddPost({
      id: `${Date.now()}`,
      title: title.trim(),
      countryName: countryName || null,
      tripDate: tripDate.trim(),
      content: content.trim(),
      rating,
      createdAt: new Date().toISOString(),
    });
    resetForm();
    setShowForm(false);
  };

  const matchedCountry = (name) => COUNTRIES.find((c) => c.name === name);

  return (
    <div className="max-w-3xl mx-auto px-5 py-8">
      <div className="flex items-center gap-2 text-[#3F7268]">
        <NotebookPen size={16} strokeWidth={1.75} />

          <p className="text-[13px] text-[#5c5644] mt-2 leading-relaxed max-w-md">
            Racconta i viaggi che hai già fatto, o annota qualsiasi cosa ti sembri interessante — consigli,
            ricordi, cose da non dimenticare. Resta salvato qui anche se chiudi l'app.
          </p>
        </div>
        <button
          onClick={() => setShowForm((v) => !v)}
          className="flex items-center gap-1.5 px-3.5 py-2.5 text-[13px] text-white shrink-0"

      </div>

      {showForm && (

            <div>

            </div>
            <div>
              <label className="text-[10.5px] tracking-[0.1em] text-[#8a7f66] uppercase">Paese (opzionale)</label>
              <select
                value={countryName}

              >

                  <option key={c.name} value={c.name}>

                  </option>

            </div>
            <div>
              <label className="text-[10.5px] tracking-[0.1em] text-[#8a7f66] uppercase">Quando (opzionale)</label>

            />

          </div>
        ) : (
          posts
            .slice()
            .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
            .map((post) => {
              const country = post.countryName ? matchedCountry(post.countryName) : null;
              return (
                <article key={post.id} className="border border-[#d8cdb2] bg-[#F7F3E8] p-5">
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <div className="flex items-center gap-2">
                        {country && <span className="text-xl">{country.flag}</span>}
                        <h3 className="font-serif text-[19px] text-[#1B2A38] leading-tight">{post.title}</h3>
                      </div>
                      <div className="flex items-center gap-2 mt-1 text-[11.5px] text-[#8a7f66]">
                        {post.countryName && <span>{post.countryName}</span>}
                        {post.tripDate && <span>· {post.tripDate}</span>}
                        {post.rating > 0 && (
                          <span className="flex items-center gap-0.5">
                            ·{" "}
                            {Array.from({ length: post.rating }).map((_, i) => (
                              <Star key={i} size={11} className="text-[#C9973E] fill-[#C9973E]" />
                            ))}
                          </span>
                        )}
                      </div>
                    </div>
                    {confirmDeleteId === post.id ? (
                      <div className="flex items-center gap-1.5 shrink-0">
                        <button
                          onClick={() => {
                            onDeletePost(post.id);
                            setConfirmDeleteId(null);
                          }}
                          className="text-[11px] px-2 py-1 text-white"
                          style={{ backgroundColor: "#A6462F" }}
                        >
                          Confermi?
                        </button>
                        <button
                          onClick={() => setConfirmDeleteId(null)}
                          className="text-[11px] px-2 py-1 border border-[#d8cdb2] text-[#5c5644]"
                        >
                          Annulla
                        </button>
                      </div>
                    ) : (
                      <button
                        onClick={() => setConfirmDeleteId(post.id)}
                        className="text-[#8a7f66] hover:text-[#A6462F] shrink-0"
                        title="Elimina"
                      >
                        <Trash2 size={15} />
                      </button>
                    )}
                  </div>
                  <p className="text-[14px] text-[#1B2A38] leading-relaxed mt-3 whitespace-pre-wrap">
                    {post.content}
                  </p>
                </article>
              );
            })
        )}
      </div>
    </div>
  );
}

function TravelInfoApp() {
  const [page, setPage] = useState("guida");
  const [query, setQuery] = useState("");
  const [continent, setContinent] = useState("tutti");
  const [selectedName, setSelectedName] = useState(null);
  const [visited, setVisited] = useState(new Set());
  const [storageReady, setStorageReady] = useState(false);
  const [blogPosts, setBlogPosts] = useState([]);
  const [blogStorageReady, setBlogStorageReady] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const result = await storage.get("visited-countries");
        if (result?.value) {
          const names = JSON.parse(result.value);
          setVisited(new Set(names));
        }
      } catch (e) {
        // nessun dato salvato ancora, si parte da zero
      } finally {
        setStorageReady(true);
      }
    })();
    (async () => {
      try {
        const result = await storage.get("blog-posts");
        if (result?.value) {
          setBlogPosts(JSON.parse(result.value));
        }
      } catch (e) {
        // nessun post salvato ancora
      } finally {
        setBlogStorageReady(true);
      }
    })();
  }, []);

  const addBlogPost = (post) => {
    setBlogPosts((prev) => {
      const next = [...prev, post];
      storage.set("blog-posts", JSON.stringify(next)).catch(() => {});
      return next;
    });
  };

  const deleteBlogPost = (id) => {
    setBlogPosts((prev) => {
      const next = prev.filter((p) => p.id !== id);
      storage.set("blog-posts", JSON.stringify(next)).catch(() => {});
      return next;
    });
  };

  const toggleVisited = (name) => {
    setVisited((prev) => {
      const next = new Set(prev);
      if (next.has(name)) next.delete(name);
      else next.add(name);
      if (storageReady) {
        storage.set("visited-countries", JSON.stringify([...next])).catch(() => {});
      }
      return next;
    });
  };

  const openCountry = (country) => {
    setSelectedName(country.name);
    setPage("paese");
  };

  const selectedCountry = COUNTRIES.find((c) => c.name === selectedName) || null;

  const filtered = useMemo(() => {
    return COUNTRIES.filter((c) => {
      const matchesContinent = continent === "tutti" || c.continent === continent;
      const matchesQuery = c.name.toLowerCase().includes(query.toLowerCase());
      return matchesContinent && matchesQuery;
    }).sort((a, b) => a.name.localeCompare(b.name));
  }, [query, continent]);

  const grouped = useMemo(() => {
    if (continent !== "tutti" || query) return null;
    return CONTINENT_ORDER.map((id) => ({
      id,
      label: CONTINENTS.find((c) => c.id === id).label,
      items: COUNTRIES.filter((c) => c.continent === id).sort((a, b) => a.name.localeCompare(b.name)),
    }));
  }, [continent, query]);

  const counts = useMemo(() => {
    const map = { tutti: COUNTRIES.length };
    CONTINENTS.slice(1).forEach((c) => {
      map[c.id] = COUNTRIES.filter((co) => co.continent === c.id).length;
    });
    return map;
  }, []);

  return (
    <div
      className="min-h-screen text-[#1B2A38]"
      style={{
        fontFamily: "'Libre Franklin', sans-serif",
        backgroundColor: "#EDE6D6",
        backgroundImage:
          "radial-gradient(circle, rgba(27,42,56,0.08) 1px, transparent 1px)",
        backgroundSize: "18px 18px",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Libre+Franklin:wght@400;500;600&display=swap');
        .font-serif { font-family: 'Fraunces', serif; }
      `}</style>

      {/* Header */}
      <header className="border-b border-[#d8cdb2] bg-[#F7F3E8] relative overflow-hidden">
        <svg
          className="absolute -right-10 -top-10 opacity-[0.06] pointer-events-none"
          width="280" height="280" viewBox="0 0 100 100"
        >
          <circle cx="50" cy="50" r="46" fill="none" stroke="#1B2A38" strokeWidth="0.6" />
          <circle cx="50" cy="50" r="30" fill="none" stroke="#1B2A38" strokeWidth="0.6" />
          <line x1="50" y1="4" x2="50" y2="96" stroke="#1B2A38" strokeWidth="0.6" />
          <line x1="4" y1="50" x2="96" y2="50" stroke="#1B2A38" strokeWidth="0.6" />
          <path d="M50 12 L54 50 L50 88 L46 50 Z" fill="#1B2A38" />
        </svg>

        <div className="max-w-5xl mx-auto px-5 pt-9 pb-6 relative">
          <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-6">
            <div className="max-w-lg">
              <div className="flex items-center gap-2 text-[#3F7268]">
                <Compass size={18} strokeWidth={1.75} />
                <span className="text-[11.5px] tracking-[0.16em] uppercase">Guida di viaggio</span>
              </div>
              <h1 className="font-serif text-[32px] sm:text-[40px] leading-[1.08] mt-2">
                Dove si va, cosa serve saperlo prima.
              </h1>
              <p className="text-[14px] text-[#5c5644] mt-3">
                Valuta, lingua, visto, sicurezza, presa elettrica e un consiglio pratico per {COUNTRIES.length} paesi.
              </p>
            </div>

            <div
              className="shrink-0 self-start md:self-auto border border-dashed border-[#8a7f66] px-4 py-3 -rotate-1 bg-[#EDE6D6]"
              style={{ minWidth: 190 }}
            >
              <div className="flex items-center gap-2 text-[#8a7f66]">
                <Plane size={13} />
                <span className="text-[10px] tracking-[0.14em] uppercase">Catalogo paesi</span>
              </div>
              <div className="flex items-baseline gap-1.5 mt-1">
                <span className="font-serif text-[26px] text-[#1B2A38]">{COUNTRIES.length}</span>
                <span className="text-[12px] text-[#8a7f66]">destinazioni</span>
              </div>
              <div className="mt-1 text-[11px] text-[#8a7f66]">{CONTINENT_ORDER.length} continenti coperti</div>
            </div>
          </div>

          <div className="mt-6 relative max-w-sm">
            <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#8a7f66]" />
            <input
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Cerca un paese..."
              className="w-full pl-9 pr-3 py-2.5 bg-[#EDE6D6] border border-[#d8cdb2] text-[14px] placeholder:text-[#8a7f66] focus:outline-none focus:ring-2 focus:ring-[#3F7268]/40 focus:border-[#3F7268]"
            />
          </div>
        </div>
      </header>

      {/* Navigazione tra pagine */}
      <nav className="bg-[#F7F3E8] border-b border-[#d8cdb2]">
        <div className="max-w-5xl mx-auto px-5 flex gap-6">
          <button
            onClick={() => setPage("guida")}
            className="flex items-center gap-1.5 py-3.5 text-[13.5px] border-b-2 transition-colors"
            style={{
              borderColor: page === "guida" || page === "paese" ? "#3F7268" : "transparent",
              color: page === "guida" || page === "paese" ? "#1B2A38" : "#8a7f66",
            }}
          >
            <BookOpen size={14} strokeWidth={1.75} />
            Guida ai paesi
          </button>
          <button
            onClick={() => setPage("mappa")}
            className="flex items-center gap-1.5 py-3.5 text-[13.5px] border-b-2 transition-colors"
            style={{
              borderColor: page === "mappa" ? "#3F7268" : "transparent",
              color: page === "mappa" ? "#1B2A38" : "#8a7f66",
            }}
          >
            <MapPinned size={14} strokeWidth={1.75} />
            Mappa e paesi visitati
          </button>
          <button
            onClick={() => setPage("voli")}
            className="flex items-center gap-1.5 py-3.5 text-[13.5px] border-b-2 transition-colors"
            style={{
              borderColor: page === "voli" ? "#3F7268" : "transparent",
              color: page === "voli" ? "#1B2A38" : "#8a7f66",
            }}
          >
            <Ticket size={14} strokeWidth={1.75} />
            Prezzo medio del volo
          </button>
          <button
            onClick={() => setPage("blog")}
            className="flex items-center gap-1.5 py-3.5 text-[13.5px] border-b-2 transition-colors"
            style={{
              borderColor: page === "blog" ? "#3F7268" : "transparent",
              color: page === "blog" ? "#1B2A38" : "#8a7f66",
            }}
          >
            <NotebookPen size={14} strokeWidth={1.75} />
            Blog di viaggio
          </button>
        </div>
      </nav>

      {page === "guida" && (
        <>
          {/* Filtro continenti */}
          <div className="max-w-5xl mx-auto px-5 pt-7">
            <div className="flex items-center gap-2 mb-3 text-[#8a7f66]">
              <MapPin size={13} />
              <span className="text-[11px] tracking-[0.08em] uppercase">Filtra per area geografica</span>
            </div>
            <div className="flex flex-wrap gap-2">
              {CONTINENTS.map((c) => {
                const active = continent === c.id;
                const color = CONTINENT_COLORS[c.id] || "#1B2A38";
                return (
                  <button
                    key={c.id}
                    onClick={() => setContinent(c.id)}
                    className="flex items-center gap-2 px-3.5 py-2 border text-[13px] transition-colors"
                    style={{
                      borderColor: active ? color : "#d8cdb2",
                      backgroundColor: active ? color : "#F7F3E8",
                      color: active ? "#F7F3E8" : "#1B2A38",
                    }}
                  >
                    {c.id !== "tutti" && (
                      <span className="w-2 h-2 rounded-full" style={{ backgroundColor: active ? "#F7F3E8" : color }} />
                    )}
                    {c.label}
                    <span className={active ? "text-[#F7F3E8]/70" : "text-[#8a7f66]"}>· {counts[c.id]}</span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Contenuto */}
          <main className="max-w-5xl mx-auto px-5 py-8">
            {filtered.length === 0 ? (
              <div className="text-center py-16 text-[#8a7f66]">
                <Globe2 size={28} className="mx-auto mb-3 text-[#d8cdb2]" />
                <p className="font-serif text-[18px] text-[#1B2A38] mb-1">Nessun paese trovato</p>
                <p className="text-[13px]">Prova a cambiare la ricerca o l'area geografica.</p>
              </div>
            ) : grouped ? (
              <div className="space-y-9">
                {grouped.map((group) => (
                  <section key={group.id}>
                    <div className="flex items-center gap-3 mb-3.5">
                      <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: CONTINENT_COLORS[group.id] }} />
                      <h2 className="font-serif text-[19px] text-[#1B2A38]">{group.label}</h2>
                      <div className="flex-1 border-t border-dashed border-[#d8cdb2]" />
                      <span className="text-[12px] text-[#8a7f66]">{group.items.length} paesi</span>
                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                      {group.items.map((c) => (
                        <CountryCard key={c.name} country={c} onOpen={openCountry} />
                      ))}
                    </div>
                  </section>
                ))}
              </div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                {filtered.map((c) => (
                  <CountryCard key={c.name} country={c} onOpen={openCountry} />
                ))}
              </div>
            )}
          </main>
        </>
      )}

      {page === "paese" && selectedCountry && (
        <CountryPage
          country={selectedCountry}
          onBack={() => setPage("guida")}
          onOpenCountry={openCountry}
          visited={visited}
          onToggleVisited={toggleVisited}
        />
      )}

      {page === "mappa" && (
        <MapPage visited={visited} onToggleVisited={toggleVisited} onOpenCountry={openCountry} />
      )}

      {page === "voli" && (
        <main className="max-w-5xl mx-auto px-5 py-8">
          <FlightsPage />
        </main>
      )}

      {page === "blog" && (
        <BlogPage
          posts={blogPosts}
          onAddPost={addBlogPost}
          onDeletePost={deleteBlogPost}
          storageReady={blogStorageReady}
        />
      )}

      <footer className="max-w-5xl mx-auto px-5 pb-10 pt-2 text-[12px] text-[#8a7f66] border-t border-dashed border-[#d8cdb2]">
        Le informazioni su visti, sicurezza e norme locali cambiano nel tempo: verifica sempre le fonti ufficiali prima di partire.
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TravelInfoApp />);
</script>
</body>
</html>
